<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Coffee | Premium Roasters</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- TMA Solution SDK — Generated from Platform Integration Page -->
    <script type="module">
        var options = {
            scope: "playground",
            url: {
                api: "https://revamp-unomi.techgadgetforus.com",
                script: "https://revamp-api.techgadgetforus.com"
            },
            source: { id: "coffee-shop-demo" },
            initialPageProperties: {
                path: location.pathname + location.hash,
                pageInfo: {
                    pageID: "index",
                    pageName: document.title,
                    pagePath: document.location.pathname,
                    destinationURL: document.location.origin + document.location.pathname,
                    language: "en",
                    categories: [],
                    tags: []
                }
            },
            webPersonalization: {
                endpoint: 'https://revamp-api.techgadgetforus.com',
                scope: 'playground'
            }
        };
        var bimax = false;

        window.dxp || (window.dxp = {});
        (function () {
            var queue = [];
            var methods = [
                "trackSubmit", "trackClick", "trackLink", "trackForm", "initialize", "pageview", "identify",
                "reset", "group", "track", "ready", "alias", "debug", "page", "once", "off", "on", "personalize"
            ];
            function createMethod(method) {
                return function () {
                    var args = Array.prototype.slice.call(arguments);
                    args.unshift(method);
                    queue.push(args);
                    return window.dxp;
                };
            }
            for (var i = 0; i < methods.length; i++) {
                var method = methods[i];
                window.dxp[method] = createMethod(method);
            }
            function onLoad() {
                waitForSendCookiesId(window.dxp, queue);
            }
            dxp.load = function () {
                var script = document.createElement("script");
                script.type = "text/javascript";
                script.async = true;
                script.src = options.url.script + "/public/sdk/dxp-tracker.min.js";
                if (script.addEventListener) {
                    script.addEventListener("load", function () { onLoad(); }, false);
                } else {
                    script.onreadystatechange = function () {
                        if (this.readyState === "complete" || this.readyState === "loaded") {
                            onLoad(window.event);
                        }
                    };
                }
                var firstScript = document.getElementsByTagName("script")[0];
                firstScript.parentNode.insertBefore(script, firstScript);
            };
            dxp.load();
            dxp.page(options.initialPageProperties);
        })();

        // ── Helpers ──────────────────────────────────────────────────
        function urlBase64ToUint8Array(base64String) {
            var padding = '='.repeat((4 - base64String.length % 4) % 4);
            var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            var rawData = window.atob(base64);
            var outputArray = new Uint8Array(rawData.length);
            for (var i = 0; i < rawData.length; ++i) {
                outputArray[i] = rawData.charCodeAt(i);
            }
            return outputArray;
        }

        function arrayBufferToBase64(buffer) {
            var binary = '';
            var bytes = new Uint8Array(buffer);
            var len = bytes.byteLength;
            for (var i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        // ── Web Personalization ─────────────────────────────────────
        function initializeInapp() {
            return new Promise(function (resolve, reject) {
                var script = document.createElement('script');
                script.src = options.webPersonalization.endpoint + "/public/sdk-web-personalization/index.min.js";
                script.type = "module";
                script.addEventListener('load', function () {
                    if (dxp) {
                        window.inappInstance = webPersonalization(options.webPersonalization.endpoint, options.webPersonalization.scope);
                        window.inappInstance.initialize("modalWebP", function () {
                            console.log('initialized inappInstance');
                        }).then(function () {
                            inappInstance.setTracker(dxp);
                            inappInstance.injectMessageTemplate({ properties: '', value: null }, 4000);
                        });
                        resolve();
                    }
                });
                script.addEventListener('error', reject);
                document.body.appendChild(script);
            });
        }

        initializeInapp().then(function () {
            console.log('Web personalization initialized.');
        }).catch(function (error) {
            console.error('Error initializing web personalization:', error);
        });

        // ── Web Push ────────────────────────────────────────────────
        function initWebPush() {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                console.log('WEB-PUSH => Service Worker and Push is supported');
                navigator.serviceWorker.register('/dxp-worker.js').then(function (registration) {
                    console.log('WEB-PUSH => Service Worker registered, scope:', registration.scope);
                    registration.pushManager.getSubscription().then(function (subscription) {
                        if (subscription === null) {
                            console.log('WEB-PUSH => No existing subscription, requesting permission...');
                            Notification.requestPermission().then(function (permission) {
                                console.log('WEB-PUSH => Permission result:', permission);
                                if (permission === 'granted') {
                                    registration.pushManager.subscribe({
                                        userVisibleOnly: true,
                                        applicationServerKey: urlBase64ToUint8Array("BA1AGMZH1dlMYfWMw-3eO4NO4Yq_cNL-OzA8kP3xvr1IR-Nwcd5NrdbM-U-MOorkSRsH3i7VjricbCskphkfkHg")
                                    }).then(function (subscription) {
                                        var subscriptionData = {
                                            endpoint: subscription.endpoint,
                                            expirationTime: subscription.expirationTime,
                                            keys: {
                                                p256dh: arrayBufferToBase64(subscription.getKey('p256dh')),
                                                auth: arrayBufferToBase64(subscription.getKey('auth'))
                                            }
                                        };
                                        window.dxp.track("PushNotificationAccepted", { subscription: subscriptionData, isAllowed: true });
                                    }).catch(function (error) {
                                        console.error('Unable to subscribe to push', error);
                                    });
                                } else {
                                    window.dxp.track("PushNotificationRejected", { isAllowed: false });
                                }
                            });
                        } else {
                            console.log('WEB-PUSH => Already subscribed, endpoint:', subscription.endpoint.substring(0, 60) + '...');
                            var subscriptionData = {
                                endpoint: subscription.endpoint,
                                expirationTime: subscription.expirationTime,
                                keys: {
                                    p256dh: arrayBufferToBase64(subscription.getKey('p256dh')),
                                    auth: arrayBufferToBase64(subscription.getKey('auth'))
                                }
                            };
                            window.dxp.track("PushNotificationAccepted", { subscription: subscriptionData, isAllowed: true });
                            console.log('WEB-PUSH => Re-sent subscription to Unomi via dxp.track');
                        }
                    });
                }).catch(function (error) {
                    console.error('WEB-PUSH => Service Worker registration failed:', error);
                });
            } else {
                console.warn('WEB-PUSH => Push messaging is not supported');
            }
        }

        initWebPush();

        // ── SDK Initialization (waits for sendCookiesId from tracker) ──
        function waitForSendCookiesId(entity, queue) {
            const interval = setInterval(async () => {
                if (typeof sendCookiesId === 'function') {
                    try {
                        entity.addSourceMiddleware(sendCookiesId);
                        console.log('sendCookiesId has been successfully executed.');
                    } catch (err) {
                        console.error('Error executing sendCookiesId:', err);
                    } finally {
                        clearInterval(interval);
                        entity.initialize({ "Apache Unomi": options });
                        while (queue.length > 0) {
                            var args = queue.shift();
                            var methodName = args.shift();
                            dxp[methodName] && dxp[methodName].apply(dxp, args);
                        }
                    }
                }
            }, 0);
        }
    </script>
</body>

</html>
